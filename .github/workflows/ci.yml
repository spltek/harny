name: CI

on:
  # Automatico solo su main/master; per tutto il resto si usa il bottone
  # "Run workflow" (workflow_dispatch).
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: package (vsix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      # The .vsix is universal (pure JS, no native deps): the same file
      # installs on Windows, Linux and macOS.
      - uses: actions/upload-artifact@v4
        with:
          name: harny-vsix
          path: "*.vsix"
          if-no-files-found: error
