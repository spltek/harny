name: CI

on:
  # Automatico SOLO sui commit in main; per il resto si usa il bottone
  # "Run workflow" (workflow_dispatch).
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (3 OSes)
    uses: ./.github/workflows/test-matrix.yml

  package:
    name: package (vsix)
    # The .vsix is universal (pure JS, no native deps) and built on Linux, but it INSTALLS on
    # Windows, Linux and macOS — so it is built only from a tree all three have already blessed.
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # This build is NOT a tagged release: stamp a `-dev.<run>` version so it is
      # clearly distinguishable from the versioned release artifacts.
      - name: Dev version (not a tagged release)
        run: |
          base=$(node -p "require('./package.json').version")
          npm version "${base}-dev.${GITHUB_RUN_NUMBER}" --no-git-tag-version
      - run: npm run package
      # The .vsix is universal (pure JS, no native deps): the same file
      # installs on Windows, Linux and macOS.
      - uses: actions/upload-artifact@v7
        with:
          name: harny-vsix
          path: "*.vsix"
          if-no-files-found: error
