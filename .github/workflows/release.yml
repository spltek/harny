name: Release

on:
  # Automatico quando pushi un tag di versione (v0.1.0, v1.2.3, ...): crea una
  # release con l'artefatto VERSIONATO. In alternativa, manuale dal bottone.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da rilasciare (deve esistere già, es. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  # OIDC: lets the Open VSX step publish via TRUSTED PUBLISHING (no PAT secret).
  id-token: write

jobs:
  # A release must never publish UNTESTED code — and "tested" means tested on the OSes the .vsix
  # is installed on. This gate used to be a single `ubuntu-24.04` job while the release shipped to
  # Windows and macOS users too: `v0.9.5` and `v0.9.6` were both tagged while `windows-latest` had
  # been red for twelve commits. The gate is now the SAME reusable workflow CI runs, so a release
  # cannot be blessed by a narrower suite than the one that guards `main`.
  verify:
    name: verify (3 OSes)
    uses: ./.github/workflows/test-matrix.yml
    # The gate tests the SAME tree the release job will package (see the `if [ "$want" = "$have" ]`
    # step below, which rewrites the version when the tag and the manifest disagree): a hand-run
    # dispatch carries the tag as an INPUT while the triggering ref is `main`, so leaving this out
    # would bless one tree and ship another.
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  release:
    name: release ${{ github.event.inputs.tag || github.ref_name }}
    # `needs:` on a whole matrix job waits for EVERY leg: one red OS and nothing is published,
    # no .vsix on the Release, no Marketplace, no Open VSX. The publish steps are irreversible,
    # so the gate has to be a dependency rather than a step in the middle of them.
    needs: verify
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Typecheck and the suite already ran in `verify`, on all three OSes — the only steps left
      # here are the ones that need THIS checked-out ref and the credentials: build, package, ship.
      # Version the extension from the tag (v0.2.0 -> 0.2.0) so the shipped
      # .vsix is named and carries that exact version. Usually the tag already
      # points at the `npm version` commit, so this is a no-op then; it only
      # rewrites package.json when tag and manifest diverge (manual tagging).
      - name: Set the version from the tag
        run: |
          want="${TAG#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" = "$have" ]; then
            echo "package.json is already at ${want}."
          else
            npm version "$want" --no-git-tag-version
          fi
      - run: npm run build
      - run: npm run package
      - name: Publish the .vsix to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ./*.vsix --clobber
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes ./*.vsix
          fi
      # Both galleries auto-update installed extensions (VS Code / VSCodium).
      # The Marketplace step is OPT-IN: it no-ops when VSCE_PAT is not set
      # (`secrets` cannot be used in a step `if`, so the guard is in the script).
      # Open VSX uses trusted publishing (OIDC): no secret, but it requires a
      # trusted publisher registered for `spltek` (repo + this workflow file).
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not set — skipping the VS Code Marketplace publish."
            exit 0
          fi
          npx @vscode/vsce publish --packagePath ./*.vsix -p "$VSCE_PAT"
      # Two ways in, and the reason for the fallback is worth writing down:
      #  - trusted publishing (OIDC, no secret) needs open-vsx.org to RESOLVE the
      #    repository, and it does that without credentials, so a PRIVATE repo
      #    comes back as "Could not resolve GitHub repository owner/name" and the
      #    registration form cannot even be submitted;
      #  - the OVSX_PAT access token works with a private repo, and the ovsx CLI
      #    disables trusted publishing by itself when a token is given.
      # So: set the secret to publish from a private repository; once the repo is
      # public, remove it and OIDC takes over (the token can then be revoked).
      - name: Publish to Open VSX (VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "Open VSX: publishing with OVSX_PAT (private repository)."
            npx --yes ovsx@^1.2.0 publish ./*.vsix -p "$OVSX_PAT"
          else
            echo "Open VSX: publishing with trusted publishing (OIDC)."
            npx --yes ovsx@^1.2.0 publish ./*.vsix --trusted-publishing
          fi
