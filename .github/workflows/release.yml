name: Release

on:
  # Automatico quando pushi un tag di versione (v0.1.0, v1.2.3, ...): crea una
  # release con l'artefatto VERSIONATO. In alternativa, manuale dal bottone.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da rilasciare (deve esistere già, es. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A release must never publish UNTESTED code.
      - run: npm run typecheck
      - run: npm test
      # Version the extension from the tag (v0.2.0 -> 0.2.0) so the shipped
      # .vsix is named and carries that exact version.
      - name: Set the version from the tag
        run: npm version "${TAG#v}" --no-git-tag-version
      - run: npm run build
      - run: npm run package
      - name: Publish the .vsix to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ./*.vsix --clobber
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes ./*.vsix
          fi
      # Both galleries auto-update installed extensions (VS Code / VSCodium).
      # These steps are OPT-IN: without the secret they are skipped and the
      # GitHub Release above is still created.
      - name: Publish to the VS Code Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath ./*.vsix -p "$VSCE_PAT"
      - name: Publish to Open VSX (VSCodium)
        if: ${{ secrets.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish ./*.vsix -p "$OVSX_PAT"
