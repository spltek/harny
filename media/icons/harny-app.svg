<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- HARNY, the SQUARE canvas: the activity bar, and the source of the marketplace PNG beside
       this file. Same drawing as `harny.svg` (the drift guard in src/chat/icons.test.ts compares
       the two command by command), same LITERAL tan — `#d08856`, the palette entry `user-msg`
       and the midpoint of the brand's old gradient — but a different FRAME, and the frame is the
       whole reason both files exist:

         - VS Code paints a views-container icon into a 24x24 slot, so the canvas must be square;
           a 15:11 viewBox there came out blank/tiny once already (pinned in
           src/package-manifest.test.ts). Hence the mark sits INSET in the square, normalized to
           a 24x24 grid.
         - the panel needs the opposite: its sign-off must be exactly one bubble tall, so there
           the canvas IS the ink (`harny.svg`, 24 x 17.6).

       One artwork, two frames: the same orange, here and in `harny.svg`, so the icon in the
       activity bar and the mark beside a prompt cannot drift apart. The colour is written into
       both elements instead of inherited from the root: the silhouette is filled, the caret is
       `fill="none"`, so a root fill would never reach the caret's stroke. (No gradient, no id: a
       file that is also shown on its own — as the base of the marketplace PNG, as an `<img>` in
       the contact sheet — must not depend on anything defined inside it either.) Neither
       file is inlined as a picture — both are served as files through asWebviewUri — but the
       registry still carries them, because harny.svg is ALSO inlined as the prompt sign-off.

       The brand works in thousandths of a unit: `translate(-3.045 1.123) scale(0.024664)` puts
       its union box (170..1050 x 118..763.33) on this canvas. -->
