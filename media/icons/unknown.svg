<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- UNKNOWN TOOL: the mark of a tool call whose name matches nothing we ship — a
       provider handed over `Greplike" string="true` (the arguments landed in the name
       field), or a session replayed a call to a tool that no longer exists.
       Lucide `badge-question-mark`, geometry verbatim: nothing but paint and size
       changed (no width/height — the caller owns it — and the weight from 2 to 1.5,
       the family's). A QUESTION, not the old 🔧: the emoji was the only "mark" in the
       panel that was not artwork here, it changed shape on every OS, and it said
       "some tool" when the truth is "no tool". -->
  <path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" stroke="currentColor"/>
  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" stroke="currentColor"/>
  <path d="M12 17h.01" stroke="currentColor"/>
</svg>
