<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Grep: the Lucide `search-code` (revision of 2024-04-24, still what
       lucide-static serves) — a lens over `</>`, which says CODE rather than
       "some text", and keeps it distinguishable from the plain `search` mark the
       find bar wears. Geometry verbatim: nothing but paint and size changed
       (no width/height — the caller owns it — and the weight from 2 to 1.5, the
       family's). It replaced a lens over two ruled lines: that drew "text", and
       sat one stroke away from the search button. -->
  <path d="m13 13.5 2-2.5-2-2.5"/>
  <path d="m21 21-4.3-4.3"/>
  <path d="M9 8.5 7 11l2 2.5"/>
