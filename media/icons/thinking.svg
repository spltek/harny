  <!-- Thinking: the Lucide `brain` — the reference SVG verbatim (9 paths, every
       `d` untouched, so the anatomy is still the original: two hemispheres, the
       folds, the stem). Two things moved and nothing else:
         - the PAINT to the root, because it is uniform here (`fill`, `stroke`,
           `stroke-width`, caps, joins) — the same rule every file in this folder
           follows, and it keeps the markup to one line per path;
         - the WEIGHT from 2 to 1.5, the weight of the tool marks a Thinking
           block sits between (it shipped at 2, which reads as a different set
           once the folds and the stem are this close together).
       No width/height: the caller owns the size. -->
