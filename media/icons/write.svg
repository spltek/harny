  <!-- Write: the Lucide `notebook-pen` — the same notebook as `read`
       (`notebook-text`: identical body and the same four rings at M2 6/10/14/18),
       with a pen where Read has ruled lines. The pair is now one book and two
       verbs, which is the only reliable way to tell them apart at 13 px.
       It replaces a page with a `+` inside: that plus said "new content" but
       looked like the fold of an edit box, and the page silhouette was shared
       with Edit and ReadLints.
