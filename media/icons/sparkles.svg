<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Build: 1.8 is the one weight in the folder between the tool marks (1.5) and
       the chrome (2) — it was there to keep the star readable at 12 px. -->
  <!-- The drawing sat 1.5 right and 0.5 low in its own box (bbox 17×19 centred at
       13.5,12.5): in a row of marks it looked shoved off-centre, so the group is
       translated back onto the middle. `d` attributes untouched. -->
  <g transform="translate(-1.5 -0.5)">
    <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
