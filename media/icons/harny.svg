<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 17.6" fill="#d08856" fill-rule="evenodd">
  <!-- HARNY: the brand mark, whole — the speech bubble with the prompt caret knocked out of it,
       and beside it the answering caret. This is the sign-off hung OUTSIDE an orange prompt
       bubble (view.ts `userAvatar`, CSS `.msg.user > .user-avatar`): the person in a round frame
       it replaced said "a human typed this", which the orange bubble already says; the brand says
       the same and says WHOSE.

       FILLED, not an outline: the transcript draws every mark as a 1.5 hairline, and a hairline
       LOGO beside a solid bubble reads as a smaller thing than the bubble — reported, and true,
       because a stroke drawing is mostly empty space. So the brand keeps its own paint, like the
       gear, the play triangle and the stop square, which are solid for the same reason.

       The canvas IS the artwork's box, and it is not square — 24 x 17.6, i.e. 15:11, the brand's
       own proportion. That is deliberate and it is the second thing reported: on a square 24x24
       canvas this drawing leaves air above and below itself, so the mark sat a couple of pixels
       LOWER than the bubble it signs and nothing could make it taller without going back to a
       three-quarters-size bubble. Here the ink touches all four edges, so the CSS gives it a box
       of exactly 15:11 that is one one-line bubble tall, and the two silhouettes line up: same
       top edge, same bottom edge. Square is right for a glyph; a picture keeps its own shape.

       Same composition as `media/icon.svg`, not a redrawing: both elements are the brand's own,
       mapped once onto this canvas. The brand works in thousandths of a unit
       (`translate(-3.045 1.123) scale(0.024664)` puts it on 24) and its union box is
       170..1050 x 118..763.33, so it maps ISOTROPICALLY (k = 24/880 = 0.0272727) onto
       24 x 17.6. The bubble+tail was once cropped out of that box to make the mark fit a square
       slot; that version read as an unfinished logo — the answering caret is half the mark — and
       the crop is what forced the too-small bubble. Crop gone, proportion back.

       ONE rule of this folder is bent here, and it is stated in the README: every other file is
       painted with `currentColor`, because a mark takes the colour of the text it sits in. This
       is a PICTURE, not a mark: it carries the BRAND tan, literally, and could not take the
       panel text colour without turning into the colour of a label.

       That tan is the ORIGINAL brand colour. The logo used to be drawn with a gradient from
       `#DB9462` to `#C67B49`, gently lit from the top left; `#d08856` is that gradient’s
       MIDPOINT, picked so that one FLAT value can serve both this picture and the prompt bubble
       beside it — `user-msg` in `src/chat/view-config.ts` holds the very same literal, so the
       sign-off and the bubble it signs are one colour instead of a near-miss of each other (a
       gradient cannot fill a bubble, and two tans would read as two mistakes).
       A literal — a value, NOT a reference to that custom property: this file is also rendered
       on its own (in the contact sheet as an `<img>`, in the activity bar by VS Code) where no
       panel variable exists, and a reference that cannot be resolved paints BLACK, not nothing.
       (The light theme bubble is a shade deeper, `#c67b49` — the old gradient’s dark end,
       where paper needs the weight; one file cannot follow the theme, and the brand keeps its
       own hue, exactly as `harny-app.svg` does.)

       The silhouette inherits the paint from the root, where rule 6 puts a paint that is
       uniform. The caret cannot: it is `fill="none"`, so the root fill never reaches its
       stroke and the same colour is named there explicitly — which is the drawing anyway, one
       filled shape and one stroked line, exactly as the brand draws them.

       The prompt caret is the brand's own rounded outline as a SUB-PATH, not a stroke: with
       `fill-rule: evenodd` it is punched out of the silhouette, so what shows through is the
       panel behind — the same hole the app icon has. The answering caret IS a stroke, the
       brand's polyline, so it keeps its round caps at any size.

       No width/height: the caller owns the size, and here the CSS owns the measure too.
       `icons.test.ts` pins the canvas ratio, the single literal tan (which must equal the
       palette entry `user-msg`), and that both brand frames carry that same tan. -->
