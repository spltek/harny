<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- USER: a person in a round frame — this family's "user" glyph (`person-round-svgrepo-com`,
       the CFPB badge). Drawn by the chat panel: it is the sign-off hung OUTSIDE an orange
       prompt bubble, one line tall, on the RIGHT of the text (view.ts `userAvatar`, CSS
       `.msg.user > .user-avatar`). A prompt is told apart by its colour and its side; the mark
       is what says a PERSON typed it rather than the harness (the nudge and the checkpoint
       carry no mark).
       Adapted, not copied. The source is a single FILLED path on an 18-unit canvas:
       a solid disc with the person punched out of it as a HOLE. Neither half survives
       the trip to this folder — a filled disc is a dot, and the hole disappears at a
       couple of pixels of stroke. So the same COMPOSITION is drawn in the
       family's conventions (outline, 24 grid, weight 1.5): the frame the badge
       already had (r 10, i.e. the source's 7.917 of 18 scaled onto 24 — it lands
       exactly here), the head the source's own ratio, and the shoulders as the one
       open arc every avatar in this family uses.
       Head and shoulders do NOT touch: in the source they are cut out of solid
       black, where a 1-unit gap is invisible, and here they are two strokes
       wide — the gap is what keeps the figure from reading as a blob.
       No width/height of its own: whoever draws it owns the size (the family default is 24). -->
  <circle cx="12" cy="12" r="10"/>
  <circle cx="12" cy="9.6" r="3.1"/>
  <path d="M7.2 19.2a4.8 4.8 0 0 1 9.6 0"/>
</svg>
